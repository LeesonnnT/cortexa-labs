  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Cortexa</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}">文章列表</a>
        <a href="https://github.com/LeesonnnT/cortexa-labs">GitHub</a>
      </nav>
    </header>

    {{ content }}

    <footer>
      <span>Cortexa Labs</span>
      <a href="https://github.com/LeesonnnT/cortexa-labs">查看源码</a>
    </footer>
  </body>
